name: Build Musify APK
on:
  workflow_dispatch:
    inputs:
      from_run:
        description: "Run id whose APK artifact should be published as a release"
        required: false
        default: ""
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    if: ${{ github.event.inputs.from_run == '' }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev build-essential ccache
          pip install --upgrade pip
          pip install buildozer==1.6.0 virtualenv
      - name: Build APK
        run: buildozer -v android debug
      - uses: actions/upload-artifact@v4
        with:
          name: Musify-apk
          path: bin/*.apk
  release:
    if: ${{ github.event.inputs.from_run != '' }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Musify-apk
          run-id: ${{ github.event.inputs.from_run }}
          github-token: ${{ github.token }}
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "apk-${{ github.event.inputs.from_run }}" ./*.apk --repo "${{ github.repository }}" --title "Musify APK ${{ github.event.inputs.from_run }}" --notes "Built from run ${{ github.event.inputs.from_run }}"
